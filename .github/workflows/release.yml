name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-24.04'
            args: '--bundles deb,appimage --no-sign'
          - platform: 'windows-latest'
            args: '--bundles nsis --no-sign'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg --no-sign'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles dmg --no-sign'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Croissant_Sama v__VERSION__"
          releaseBody: |
            ### 🥐 Croissant_Sama v__VERSION__ — Desktop Anime Chess GUI
            
            Welcome to the official public release of **Croissant_Sama**!
            
            #### 📦 Download Assets:
            - **Windows**: `Croissant_Sama___VERSION___x64-setup.exe` (NSIS Installer)
            - **Linux (Debian/Ubuntu/Mint)**: `croissant-sama___VERSION___amd64.deb`
            - **Linux (Universal)**: `croissant-sama___VERSION___amd64.AppImage`
            - **macOS (Apple Silicon & Intel)**: `Croissant_Sama___VERSION____dmg`
            
            #### ✨ Highlights:
            - 12 Sovereigns of Dawn & Dusk with bespoke 9:16 high-resolution splash art.
            - 720p HD Live Motion Video suites with in-app arrow navigation controls.
            - Interactive ecchi & tsundere coach commentary for brilliant moves, blunders, and promotions.
            - Stockfish 17 engine analysis, Chess.com game downloader, opening tree, and spaced-repetition training.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
